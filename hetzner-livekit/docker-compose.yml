services:
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      TURN_DOMAIN: ${TURN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - caddy_data:/caddy-data:ro
    depends_on:
      - redis

  # Records each participant's tracks separately (Track Egress only — see egress.yaml.template
  # for why Room Composite must never be requested against this box). Talks to livekit-server
  # over the shared Redis below, and uploads straight to R2 using credentials the backend
  # attaches to each request, so no storage secrets live here.
  #
  # No /var/run/docker.sock mount: that pattern exists for Chrome-based egress types needing
  # per-job container isolation. Track Egress handlers run in-process, so mounting the Docker
  # socket would hand this container root-equivalent access to the host for nothing.
  egress:
    image: livekit/egress:latest
    network_mode: host
    restart: unless-stopped
    # Required by the egress binary itself (Chrome's sandbox is compiled in even when, as
    # here, no Chrome-based egress type is ever requested).
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - redis
      - livekit

  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: redis-server --port 6379 --save "" --appendonly no

  # noise-agent (server-side DTLN noise cancellation, ./agent) was tried and abandoned —
  # not usable in practice. Deliberately not defined here anymore: `docker compose up -d`
  # (no service name) brings up every service in this file, so leaving a stopped-but-still-
  # defined service around is how it silently came back once already. The code is kept in
  # ./agent for reference; re-add a service block here if it's ever revived on purpose.

volumes:
  caddy_data:
  caddy_config:
